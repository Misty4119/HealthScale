name: HealthScale
version: '${version}'
author: Linmimeng
description: A health display scaling plugin for Canvas and Folia, supporting world coverage and high-health RPG servers.
website: https://github.com/Misty4119/HealthScale
main: noietime.healthscale.Healthscale
api-version: '26.2'
folia-supported: true
canvas-supported: true

permissions:
  healthscale.use:
    description: Allows using the basic /healthscale command (info)
    default: true
  healthscale.admin:
    description: Allows using the reload and set subcommands
    default: op
  healthscale.*:
    description: Grants all HealthScale permissions
    default: op
    children:
      healthscale.use: true
      healthscale.admin: true
